<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add friend — Tenkord</title>
<meta name="theme-color" content="#f5c400">
<link rel="stylesheet" href="tenkord-v3.css?v=15">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:24px; margin:0;
    background:#0a0a0a; color:#f0f0f0; font-family:Syne,system-ui,sans-serif; }
  .card { width:min(400px,100%); background:#181818; border:1px solid #2c2c2c; border-radius:12px; padding:28px 24px; text-align:center; }
  .card h1 { font-weight:800; letter-spacing:.12em; color:#f5c400; font-size:1.4rem; margin:0 0 8px; }
  .card p { color:#9a9a9a; margin:0 0 16px; line-height:1.45; }
  .peer { font-family:ui-monospace,monospace; font-size:.8rem; word-break:break-all; background:#0a0a0a; padding:12px; border-radius:8px; margin-bottom:20px; }
  .actions { display:flex; flex-direction:column; gap:10px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 16px; border-radius:8px; border:1px solid #2c2c2c; background:#2a2a2a; color:#f0f0f0; font-weight:600; cursor:pointer; font:inherit; }
  .btn.primary { background:#f5c400; color:#111; border-color:#f5c400; font-weight:700; }
  .err { color:#ed4245; margin-bottom:12px; display:none; }
  .err.show { display:block; }
</style>
</head>
<body>
  <div class="card">
    <h1>TENKORD</h1>
    <p>Someone shared a friend invite with you.</p>
    <div id="err" class="err"></div>
    <div class="peer" id="peer">...</div>
    <div class="actions">
      <button class="btn primary" id="btn-add" type="button">Add friend in Tenkord</button>
      <button class="btn" type="button" id="btn-close">Close tab</button>
    </div>
  </div>
<script>
function decodePeer(raw) {
  if (!raw) return "";
  var b64 = String(raw).replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  try {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  } catch (e1) {
    try { return atob(b64); } catch (e2) { return raw; }
  }
}
function encodePeer(peer) {
  var bytes = new TextEncoder().encode(peer);
  var bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/[+]/g, "-").replace(/[/]/g, "_").replace(/=+$/g, "");
}
(function () {
  var raw = new URLSearchParams(location.search).get("id") || "";
  var peer = decodePeer(raw);
  var el = document.getElementById("peer");
  var err = document.getElementById("err");
  var btn = document.getElementById("btn-add");
  if (!peer || !/^tk-[a-f0-9]+$/i.test(peer)) {
    err.textContent = "Invalid or missing invite id.";
    err.className = "err show";
    btn.disabled = true;
    el.textContent = peer || raw || "(none)";
  } else {
    el.textContent = peer;
  }
  window._peer = peer;
  btn.onclick = function () {
    if (!window._peer) return;
    location.href = "./index.html?id=" + encodeURIComponent(encodePeer(window._peer));
  };
  document.getElementById("btn-close").onclick = function () { window.close(); };
})();
</script>
</body>
</html>
